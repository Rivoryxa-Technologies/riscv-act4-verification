name: wrapper-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile setup.py run.py
  full-proof:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator build-essential gcc-riscv64-unknown-elf
      - run: ./reproduce.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv32e40p-act4-evidence
          path: evidence/
  historical-timer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator build-essential
      - run: python3 -m unittest discover -s tests -v
      - run: python3 historical/run.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-timer-evidence
          path: evidence/
